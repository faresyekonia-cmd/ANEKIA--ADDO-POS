name: Build ANETH DLDM POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -type f \
            -name "ANETH_DLDM_POS_V*.zip" \
            -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ANETH DLDM POS ZIP not found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find android_project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Fix Kotlin dependency conflict
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy.force(
                  'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
          }

          EOF

      - name: Replace checkout method with clean version
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/aneth/dldmpos/MainActivity.java"
          )

          if not path.exists():
              raise SystemExit("ERROR: MainActivity.java not found")

          text = path.read_text(encoding="utf-8")

          # Find checkout method
          start = text.find("void checkout(){")

          if start == -1:
              raise SystemExit(
                  "ERROR: void checkout() was not found"
              )

          # Find the next method after checkout.
          # The existing project uses methods declared with:
          #   void methodName(...)
          next_method = text.find("\n  void ", start + 5)

          if next_method == -1:
              next_method = text.find("\n void ", start + 5)

          if next_method == -1:
              raise SystemExit(
                  "ERROR: Could not find the method after checkout()"
              )

          clean_checkout = r'''void checkout(){
    if(cart.isEmpty()){
        toast("Cart iko tupu");
        return;
    }

    final SQLiteDatabase saleDb = db.getWritableDatabase();
    final java.util.HashMap<Integer,Integer> saleCart =
        new java.util.HashMap<>(cart);

    int total = 0;

    for(Integer id : saleCart.keySet()){
        Cursor c = saleDb.rawQuery(
            "SELECT price,stock FROM drugs WHERE id=?",
            new String[]{"" + id}
        );

        if(!c.moveToFirst()){
            c.close();
            toast("Dawa haikupatikana");
            return;
        }

        int q = saleCart.get(id);
        int stock = c.getInt(1);
        int price = c.getInt(0);

        if(q > stock){
            c.close();
            toast("Stock haitoshi");
            return;
        }

        total += q * price;
        c.close();
    }

    final int saleTotal = total;
    final String saleCashier = role;

    EditText paid = new EditText(this);
    paid.setHint("Kiasi alicholipa (TZS)");
    paid.setInputType(2);

    new AlertDialog.Builder(this)
        .setTitle("Jumla TZS " + saleTotal)
        .setView(paid)
        .setPositiveButton("HIFADHI", (x,w) -> {

            int p;

            try{
                p = Integer.parseInt(
                    paid.getText().toString()
                );
            }catch(Exception e){
                p = 0;
            }

            if(p < saleTotal){
                toast("Malipo hayatoshi");
                return;
            }

            ContentValues s = new ContentValues();

            s.put(
                "created_at",
                System.currentTimeMillis()
            );

            s.put("total", saleTotal);
            s.put("paid", p);
            s.put(
                "change_amount",
                p - saleTotal
            );
            s.put(
                "cashier",
                saleCashier
            );

            long sid = saleDb.insert(
                "sales",
                null,
                s
            );

            for(Integer id : saleCart.keySet()){

                Cursor c = saleDb.rawQuery(
                    "SELECT generic_name,price FROM drugs WHERE id=?",
                    new String[]{"" + id}
                );

                if(!c.moveToFirst()){
                    c.close();
                    continue;
                }

                int q = saleCart.get(id);
                int pr = c.getInt(1);

                ContentValues it =
                    new ContentValues();

                it.put("sale_id", sid);
                it.put("drug_id", id);
                it.put(
                    "generic_name",
                    c.getString(0)
                );
                it.put("qty", q);
                it.put("unit_price", pr);
                it.put(
                    "line_total",
                    q * pr
                );

                saleDb.insert(
                    "sale_items",
                    null,
                    it
                );

                saleDb.execSQL(
                    "UPDATE drugs SET stock=stock-? WHERE id=?",
                    new Object[]{q,id}
                );

                c.close();
            }

            cart.clear();

            toast(
                "Mauzo yamehifadhiwa. Chenji TZS "
                + (p - saleTotal)
            );

            sales();
        });
}'''

          # Replace the entire old checkout method
          text = (
              text[:start]
              + clean_checkout
              + text[next_method:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("========================================")
          print("CHECKOUT METHOD REPLACED SUCCESSFULLY")
          print("========================================")

          # Verify the new checkout method exists
          if "final java.util.HashMap<Integer,Integer> saleCart" not in text:
              raise SystemExit(
                  "ERROR: New checkout method was not inserted."
              )

          if "int q = saleCart.get(id);" not in text:
              raise SystemExit(
                  "ERROR: saleCart quantity code missing."
              )

          if 'saleDb.insert("sale_items"' not in text:
              raise SystemExit(
                  "ERROR: saleDb sale_items insert missing."
              )

          if "saleDb.execSQL(" not in text:
              raise SystemExit(
                  "ERROR: saleDb stock update missing."
              )

          print("Checkout verification PASSED.")
          PY

      - name: Show checkout source
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKOUT SOURCE"
          echo "========================================"

          grep -n \
            "void checkout\|saleCart\|saleDb\|saleTotal" \
            app/src/main/java/com/aneth/dldmpos/MainActivity.java

          echo ""
          echo "Checkout source check complete."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.project.outputs.PROJECT_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANETH-DLDM-POS-APK
          path: ${{ steps.apk.outputs.APK }}
          if-no-files-found: error
