name: Build ANETH DLDM POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # FIND AND EXTRACT PROJECT ZIP
      # =========================================================
      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ANETH DLDM POS project..."

          ZIP_FILE=$(find . -type f -name "ANETH_DLDM_POS_V*.zip" -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ANETH DLDM POS ZIP was not found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "Project extracted."

          find android_project -maxdepth 5 -type f | head -150

      # =========================================================
      # FIND PROJECT DIRECTORY
      # =========================================================
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find android_project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # =========================================================
      # FIX KOTLIN DEPENDENCY
      # =========================================================
      - name: Fix Kotlin dependency conflict
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy.force(
                  'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
          }

          EOF

          echo "Kotlin dependency fix applied."

      # =========================================================
      # FIX MAINACTIVITY JAVA
      # =========================================================
      - name: Fix MainActivity Java checkout lambda
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/aneth/dldmpos/MainActivity.java")

          if not path.exists():
              raise SystemExit("ERROR: MainActivity.java not found")

          text = path.read_text(encoding="utf-8")

          print("Fixing MainActivity.java...")

          # -----------------------------------------------------
          # Create final copies BEFORE the lambda
          # -----------------------------------------------------

          marker = 'EditText paid=new EditText(this);'

          if marker not in text:
              raise SystemExit(
                  "ERROR: Checkout marker was not found in MainActivity.java"
              )

          if 'final int saleTotal = total;' not in text:

              insert = '''final int saleTotal = total;
          final String saleCashier = role;
          final android.database.sqlite.SQLiteDatabase saleDb = d;
          final java.util.Map<Integer,Integer> saleCart =
              new java.util.HashMap<>(cart);

          EditText paid=new EditText(this);'''

              text = text.replace(
                  marker,
                  insert,
                  1
              )

          # -----------------------------------------------------
          # Replace variables inside lambda
          # -----------------------------------------------------

          replacements = {

              # total
              'if(p<total)':
              'if(p<saleTotal)',

              'if (p<total)':
              'if (p<saleTotal)',

              's.put("total",total)':
              's.put("total",saleTotal)',

              's.put("total", total)':
              's.put("total", saleTotal)',

              's.put("change_amount",p-total)':
              's.put("change_amount",p-saleTotal)',

              's.put("change_amount", p-total)':
              's.put("change_amount", p-saleTotal)',

              'toast("Mauzo yamehifadhiwa. Chenji TZS "+(p-total))':
              'toast("Mauzo yamehifadhiwa. Chenji TZS "+(p-saleTotal))',

              'toast("Mauzo yamehifadhiwa. Chenji TZS "+(p - total))':
              'toast("Mauzo yamehifadhiwa. Chenji TZS "+(p-saleTotal))',

              # role
              's.put("cashier",role)':
              's.put("cashier",saleCashier)',

              's.put("cashier", role)':
              's.put("cashier", saleCashier)',

              # database
              'long sid=d.insert("sales",null,s)':
              'long sid=saleDb.insert("sales",null,s)',

              'long sid = d.insert("sales",null,s)':
              'long sid=saleDb.insert("sales",null,s)',

              # cart
              'for(Integer id:cart.keySet())':
              'for(Integer id:saleCart.keySet())',

              'for (Integer id:cart.keySet())':
              'for (Integer id:saleCart.keySet())',

              'for(Integer id : cart.keySet())':
              'for(Integer id:saleCart.keySet())',

              'int q=cart.get(id)':
              'int q=saleCart.get(id)',

              'int q = cart.get(id)':
              'int q=saleCart.get(id)',

              # database queries
              'd.rawQuery(':
              'saleDb.rawQuery(',

              'd.insert("sale_items",null,it)':
              'saleDb.insert("sale_items",null,it)',

              'd.insert("sale_items", null, it)':
              'saleDb.insert("sale_items",null,it)',

              'd.execSQL(':
              'saleDb.execSQL('
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # -----------------------------------------------------
          # IMPORTANT:
          # cart.clear() itself is outside the lambda concern,
          # but make sure the lambda does not reference total.
          # -----------------------------------------------------

          text = text.replace(
              '(p-total)',
              '(p-saleTotal)'
          )

          text = text.replace(
              '(p - total)',
              '(p-saleTotal)'
          )

          # -----------------------------------------------------
          # Verify that problematic references are gone
          # -----------------------------------------------------

          # Look specifically at the checkout area.
          start = text.find('EditText paid=')

          if start == -1:
              raise SystemExit("ERROR: Checkout section disappeared")

          checkout = text[start:start + 6000]

          if 'p-total' in checkout:
              raise SystemExit(
                  "ERROR: p-total still exists in checkout lambda"
              )

          if 'p - total' in checkout:
              raise SystemExit(
                  "ERROR: p - total still exists in checkout lambda"
              )

          if 's.put("total",total)' in checkout:
              raise SystemExit(
                  "ERROR: total reference still exists"
              )

          if 's.put("cashier",role)' in checkout:
              raise SystemExit(
                  "ERROR: role reference still exists"
              )

          if 'd.rawQuery(' in checkout:
              raise SystemExit(
                  "ERROR: database reference d.rawQuery still exists"
              )

          if 'for(Integer id:cart.keySet())' in checkout:
              raise SystemExit(
                  "ERROR: cart reference still exists"
              )

          # -----------------------------------------------------
          # Save
          # -----------------------------------------------------

          path.write_text(text, encoding="utf-8")

          print("======================================")
          print("MAINACTIVITY FIX SUCCESSFUL")
          print("======================================")

          PY

      # =========================================================
      # SHOW FIXED CODE FOR DEBUGGING
      # =========================================================
      - name: Verify Java source
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking MainActivity.java..."

          grep -n "saleTotal\|saleCashier\|saleDb\|saleCart" \
            app/src/main/java/com/aneth/dldmpos/MainActivity.java \
            || true

          echo "Java source check completed."

      # =========================================================
      # SETUP GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # BUILD APK
      # =========================================================
      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      # =========================================================
      # VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.project.outputs.PROJECT_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          echo "$APK"

          ls -lh "$APK"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANETH-DLDM-POS-APK
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
