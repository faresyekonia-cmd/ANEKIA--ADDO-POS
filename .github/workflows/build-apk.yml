name: Build ANETH DLDM POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -type f -name "ANETH_DLDM_POS_V*.zip" -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ANETH DLDM POS ZIP was not found."
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find android_project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Fix Kotlin dependency conflict
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy.force(
                  'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
          }

          EOF

      - name: Fix checkout code
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/aneth/dldmpos/MainActivity.java"
          )

          if not path.exists():
              raise SystemExit("MainActivity.java not found")

          text = path.read_text(encoding="utf-8")

          start = text.find('.setPositiveButton("HIFADHI"')

          if start == -1:
              raise SystemExit("HIFADHI button not found")

          end = text.find('});', start)

          if end == -1:
              raise SystemExit("HIFADHI lambda end not found")

          end += 3

          before = text[:start]
          block = text[start:end]
          after = text[end:]

          # Add final variables at the beginning of the lambda
          opening = '.setPositiveButton("HIFADHI",(x,w)->{'

          if opening not in block:
              raise SystemExit("HIFADHI lambda opening not found")

          final_opening = (
              '.setPositiveButton("HIFADHI",(x,w)->{'
              'final int saleTotal=total;'
              'final String saleCashier=role;'
              'final SQLiteDatabase saleDb=d;'
              'final java.util.Map<Integer,Integer> saleCart='
              'new java.util.HashMap<>(cart);'
          )

          block = block.replace(
              opening,
              final_opening,
              1
          )

          # --------------------------------------------------
          # Fix EVERY reference inside the checkout lambda
          # --------------------------------------------------

          block = block.replace(
              'if(p<total)',
              'if(p<saleTotal)'
          )

          block = block.replace(
              'if(p < total)',
              'if(p<saleTotal)'
          )

          block = block.replace(
              's.put("total",total)',
              's.put("total",saleTotal)'
          )

          block = block.replace(
              's.put("total", total)',
              's.put("total",saleTotal)'
          )

          block = block.replace(
              's.put("change_amount",p-total)',
              's.put("change_amount",p-saleTotal)'
          )

          block = block.replace(
              's.put("change_amount", p-total)',
              's.put("change_amount",p-saleTotal)'
          )

          block = block.replace(
              's.put("cashier",role)',
              's.put("cashier",saleCashier)'
          )

          block = block.replace(
              's.put("cashier", role)',
              's.put("cashier",saleCashier)'
          )

          block = block.replace(
              'long sid=d.insert("sales",null,s)',
              'long sid=saleDb.insert("sales",null,s)'
          )

          block = block.replace(
              'long sid=d.insert("sales", null, s)',
              'long sid=saleDb.insert("sales",null,s)'
          )

          block = block.replace(
              'for(Integer id:cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'for (Integer id:cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'for(Integer id : cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'for (Integer id : cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'int q=cart.get(id)',
              'int q=saleCart.get(id)'
          )

          block = block.replace(
              'int q = cart.get(id)',
              'int q=saleCart.get(id)'
          )

          block = block.replace(
              'd.rawQuery(',
              'saleDb.rawQuery('
          )

          block = block.replace(
              'd.insert("sale_items",null,it)',
              'saleDb.insert("sale_items",null,it)'
          )

          block = block.replace(
              'd.insert("sale_items", null, it)',
              'saleDb.insert("sale_items",null,it)'
          )

          block = block.replace(
              'd.execSQL(',
              'saleDb.execSQL('
          )

          block = block.replace(
              'Chenji TZS "+(p-total)',
              'Chenji TZS "+(p-saleTotal)'
          )

          block = block.replace(
              'Chenji TZS "+(p - total)',
              'Chenji TZS "+(p-saleTotal)'
          )

          # Rebuild the complete Java source
          path.write_text(
              before + block + after,
              encoding="utf-8"
          )

          print("Checkout code fixed successfully.")

          print("")
          print("===== CHECKOUT BLOCK =====")
          print(block)
          print("==========================")
          PY

      - name: Validate checkout code
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/aneth/dldmpos/MainActivity.java"

          echo "Checking checkout code..."

          # Extract only the HIFADHI lambda
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/aneth/dldmpos/MainActivity.java"
          )

          s = p.read_text()

          start = s.find('.setPositiveButton("HIFADHI"')
          end = s.find('});', start)

          if start == -1 or end == -1:
              raise SystemExit("Checkout lambda not found")

          block = s[start:end]

          bad = [
              'int q=cart.get(id)',
              'int q = cart.get(id)',
              'd.insert("sale_items"',
              'd.execSQL(',
              '(p-total)',
              '(p - total)'
          ]

          for item in bad:
              if item in block:
                  raise SystemExit(
                      "ERROR: Old checkout reference remains: " + item
                  )

          required = [
              'saleTotal',
              'saleCashier',
              'saleDb',
              'saleCart',
              'saleCart.get(id)',
              'saleDb.insert("sale_items"',
              'saleDb.execSQL('
          ]

          for item in required:
              if item not in block:
                  raise SystemExit(
                      "ERROR: Required checkout code missing: " + item
                  )

          print("CHECKOUT VALIDATION PASSED.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.project.outputs.PROJECT_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANETH-DLDM-POS-APK
          path: ${{ steps.apk.outputs.APK }}
          if-no-files-found: error
