name: Build ANETH DLDM POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # FIND AND EXTRACT THE ANDROID PROJECT ZIP
      # =========================================================
      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for ANETH DLDM POS ZIP..."

          ZIP_FILE=$(find . -type f -name "ANETH_DLDM_POS_V*.zip" -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ANETH DLDM POS project ZIP was not found."
            echo "Files currently in repository:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "Extracted project:"
          find android_project -maxdepth 4 -type f | head -150

      # =========================================================
      # FIND ANDROID PROJECT
      # =========================================================
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find android_project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            find android_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      # =========================================================
      # FIX KOTLIN DUPLICATE CLASS ERROR
      # =========================================================
      - name: Fix Kotlin dependency conflict
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> app/build.gradle <<'EOF'

          // =====================================================
          // ANETH DLDM POS - Kotlin dependency compatibility fix
          // =====================================================
          configurations.configureEach {
              resolutionStrategy.force(
                  'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
          }
          EOF

          echo "Kotlin dependency fix applied."

      # =========================================================
      # FIX JAVA LAMBDA VARIABLE ERROR
      # =========================================================
      - name: Fix Java lambda variables
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/aneth/dldmpos/MainActivity.java"
          )

          if not file.exists():
              raise SystemExit(
                  "ERROR: MainActivity.java was not found."
              )

          text = file.read_text(encoding="utf-8")

          marker = "EditText paid=new EditText(this);"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Checkout code marker was not found."
              )

          start = text.index(marker)

          end_marker = "sales();"

          end = text.find(end_marker, start)

          if end == -1:
              raise SystemExit(
                  "ERROR: End of checkout code was not found."
              )

          end += len(end_marker)

          block = text[start:end]

          # -----------------------------------------------------
          # Create final/effectively-final copies for lambda
          # -----------------------------------------------------
          prefix = """
          final int saleTotal = total;
          final String saleCashier = role;
          final android.database.sqlite.SQLiteDatabase saleDb = d;
          final java.util.Map<Integer,Integer> saleCart =
              new java.util.HashMap<>(cart);
          """

          block = block.replace(
              marker,
              prefix + marker,
              1
          )

          # -----------------------------------------------------
          # Replace variables used inside lambda
          # -----------------------------------------------------

          block = block.replace(
              "if(p<total)",
              "if(p<saleTotal)"
          )

          block = block.replace(
              's.put("total",total)',
              's.put("total",saleTotal)'
          )

          block = block.replace(
              's.put("change_amount",p-total)',
              's.put("change_amount",p-saleTotal)'
          )

          block = block.replace(
              's.put("cashier",role)',
              's.put("cashier",saleCashier)'
          )

          block = block.replace(
              'long sid=d.insert("sales",null,s)',
              'long sid=saleDb.insert("sales",null,s)'
          )

          block = block.replace(
              "for(Integer id:cart.keySet())",
              "for(Integer id:saleCart.keySet())"
          )

          block = block.replace(
              "int q=cart.get(id)",
              "int q=saleCart.get(id)"
          )

          block = block.replace(
              'd.rawQuery(',
              'saleDb.rawQuery('
          )

          block = block.replace(
              'd.insert("sale_items",null,it)',
              'saleDb.insert("sale_items",null,it)'
          )

          block = block.replace(
              'd.execSQL(',
              'saleDb.execSQL('
          )

          block = block.replace(
              '"Chenji TZS "+(p-total)',
              '"Chenji TZS "+(p-saleTotal)'
          )

          # -----------------------------------------------------
          # Put corrected block back into MainActivity.java
          # -----------------------------------------------------

          text = text[:start] + block + text[end:]

          file.write_text(text, encoding="utf-8")

          print("Java lambda fix applied successfully.")
          PY

      # =========================================================
      # SET UP GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # BUILD APK
      # =========================================================
      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      # =========================================================
      # VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "${{ steps.project.outputs.PROJECT_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"
          echo "$APK"
          ls -lh "$APK"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANETH-DLDM-POS-APK
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
