name: Build ANETH DLDM POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # FIND AND EXTRACT PROJECT
      # =========================================================
      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -type f -name "ANETH_DLDM_POS_V*.zip" -print -quit || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ANETH DLDM POS ZIP was not found."
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

      # =========================================================
      # FIND PROJECT
      # =========================================================
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find android_project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # =========================================================
      # KOTLIN FIX
      # =========================================================
      - name: Fix Kotlin dependency conflict
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy.force(
                  'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                  'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
          }

          EOF

      # =========================================================
      # FIX ONLY CHECKOUT LAMBDA
      # =========================================================
      - name: Fix checkout lambda
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/aneth/dldmpos/MainActivity.java")

          if not path.exists():
              raise SystemExit("MainActivity.java not found")

          text = path.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # IMPORTANT:
          # Do NOT globally replace cart/d.
          # Only modify the code INSIDE the HIFADHI lambda.
          # -----------------------------------------------------

          lambda_start = text.find(
              '.setPositiveButton("HIFADHI"'
          )

          if lambda_start == -1:
              raise SystemExit(
                  'Could not find HIFADHI checkout lambda'
              )

          lambda_end = text.find(
              '});',
              lambda_start
          )

          if lambda_end == -1:
              raise SystemExit(
                  'Could not find end of checkout lambda'
              )

          lambda_end += 3

          before = text[:lambda_start]
          block = text[lambda_start:lambda_end]
          after = text[lambda_end:]

          print("Original checkout lambda found.")

          # -----------------------------------------------------
          # Add final variables immediately inside lambda context.
          # -----------------------------------------------------

          old_open = (
              '.setPositiveButton("HIFADHI",(x,w)->{'
          )

          new_open = (
              '.setPositiveButton("HIFADHI",(x,w)->{'
              'final int saleTotal=total;'
              'final String saleCashier=role;'
              'final SQLiteDatabase saleDb=d;'
              'final java.util.Map<Integer,Integer> saleCart='
              'new java.util.HashMap<>(cart);'
          )

          if old_open not in block:
              raise SystemExit(
                  'Expected HIFADHI lambda opening was not found'
              )

          block = block.replace(
              old_open,
              new_open,
              1
          )

          # -----------------------------------------------------
          # ONLY inside lambda: use final copies.
          # -----------------------------------------------------

          block = block.replace(
              'paid.getText()',
              'paid.getText()'
          )

          block = block.replace(
              'if(p<total)',
              'if(p<saleTotal)'
          )

          block = block.replace(
              'if (p<total)',
              'if (p<saleTotal)'
          )

          block = block.replace(
              's.put("total",total)',
              's.put("total",saleTotal)'
          )

          block = block.replace(
              's.put("total", total)',
              's.put("total",saleTotal)'
          )

          block = block.replace(
              's.put("change_amount",p-total)',
              's.put("change_amount",p-saleTotal)'
          )

          block = block.replace(
              's.put("change_amount", p-total)',
              's.put("change_amount",p-saleTotal)'
          )

          block = block.replace(
              's.put("cashier",role)',
              's.put("cashier",saleCashier)'
          )

          block = block.replace(
              's.put("cashier", role)',
              's.put("cashier",saleCashier)'
          )

          block = block.replace(
              'long sid=d.insert("sales",null,s)',
              'long sid=saleDb.insert("sales",null,s)'
          )

          block = block.replace(
              'long sid=d.insert("sales", null, s)',
              'long sid=saleDb.insert("sales",null,s)'
          )

          block = block.replace(
              'for(Integer id:cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'for (Integer id:cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'for(Integer id : cart.keySet())',
              'for(Integer id:saleCart.keySet())'
          )

          block = block.replace(
              'int q=cart.get(id)',
              'int q=saleCart.get(id)'
          )

          block = block.replace(
              'int q = cart.get(id)',
              'int q=saleCart.get(id)'
          )

          block = block.replace(
              'd.rawQuery(',
              'saleDb.rawQuery('
          )

          block = block.replace(
              'd.insert("sale_items",null,it)',
              'saleDb.insert("sale_items",null,it)'
          )

          block = block.replace(
              'd.insert("sale_items", null, it)',
              'saleDb.insert("sale_items",null,it)'
          )

          block = block.replace(
              'd.execSQL(',
              'saleDb.execSQL('
          )

          block = block.replace(
              '(p-total)',
              '(p-saleTotal)'
          )

          block = block.replace(
              '(p - total)',
              '(p-saleTotal)'
          )

          # -----------------------------------------------------
          # Rebuild complete source.
          # -----------------------------------------------------

          text = before + block + after

          path.write_text(text, encoding="utf-8")

          print("Checkout lambda fixed successfully.")
          PY

      # =========================================================
      # CHECK SOURCE
      # =========================================================
      - name: Check Java source
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking MainActivity.java..."

          grep -n "void checkout" \
            app/src/main/java/com/aneth/dldmpos/MainActivity.java || true

          grep -n "saleTotal\|saleCashier\|saleDb\|saleCart" \
            app/src/main/java/com/aneth/dldmpos/MainActivity.java || true

          echo "Source check completed."

      # =========================================================
      # GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            assembleDebug \
            --stacktrace

      # =========================================================
      # VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "${{ steps.project.outputs.PROJECT_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANETH-DLDM-POS-APK
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
